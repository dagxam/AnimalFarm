name: Build AnimalFarm Refactor

on:
  push:
    branches: [ refactor/remove-duplication-optimize ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Refactor Maven build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Build plugin
        run: mvn -B -U clean package
