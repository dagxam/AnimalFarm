name: Build AnimalFarm for Purpur

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Maven build against Purpur API
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Проверить Java
        run: java -version

      - name: Собрать плагин против Purpur API
        run: mvn -B -U clean package

      - name: Загрузить JAR
        uses: actions/upload-artifact@v4
        with:
          name: AnimalFarm-Purpur
          path: target/*.jar
          if-no-files-found: error
