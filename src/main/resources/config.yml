# ============================================================
# AnimalFarm — основная конфигурация плагина
#
# ВАЖНО:
# true  = функция включена
# false = функция выключена
#
# После изменения настроек используйте:
# /animalfarm reload
# ============================================================

# ------------------------------------------------------------
# КОРМУШКА
# ------------------------------------------------------------
feeder:
  # Включить систему кормушек.
  enabled: true

  # Как часто, в секундах, плагин проверяет работу ферм.
  # Меньше значение = быстрее реакция, но выше нагрузка на сервер.
  check-interval-seconds: 5

  # На каком расстоянии животное может использовать кормушку.
  eating-distance: 2.5

  # Скорость движения животного к кормушке.
  path-speed: 1.1

  # Максимальное количество пар, которые могут размножиться
  # в одном загоне за одни игровые сутки.
  max-breeding-pairs-per-day: 10

  # Максимальное количество пустых вёдер, которое может объединяться в стак.
  water-max-stack: 16

# ------------------------------------------------------------
# ЗАГОН
# ------------------------------------------------------------
pen:
  # Максимальный радиус проверки загона от кормушки, в блоках.
  max-radius: 16

  # На сколько блоков вверх и вниз учитывается территория загона.
  vertical-range: 5

# ------------------------------------------------------------
# АКВАРИУМ
# ------------------------------------------------------------
aquarium:
  # Включить систему аквариумов.
  enabled: true

  # Максимальный радиус проверки аквариума от аквариумной полки.
  max-radius: 16

  # Вертикальная высота проверки аквариума.
  vertical-range: 5

# ------------------------------------------------------------
# HUD / ИНФОРМАЦИЯ НА ЭКРАНЕ
# ------------------------------------------------------------
hud:
  # Показывать информацию о ферме игроку.
  enabled: true

  # На каком расстоянии от фермы показывать HUD.
  range: 6

# ------------------------------------------------------------
# ВЕДРО ДЛЯ МОБОВ
# ------------------------------------------------------------
mob-bucket:
  # Разрешить ловить мобов специальным ведром плагина.
  enabled: true

# ------------------------------------------------------------
# ЛОВЛЯ ЖИВЫХ СУЩЕСТВ УДОЧКОЙ
# ------------------------------------------------------------
fishing:
  # Включить живую ловлю удочкой.
  # Если false — обычная ванильная рыбалка работает без изменений.
  enabled: true

  # Шанс в процентах, что обычный улов будет заменён живым существом.
  # 90 = примерно 90% успешных уловов будут живыми мобами.
  live-catch-chance: 90

  # Можно отдельно включать и выключать каждый тип добычи.
  mobs:
    # Все обычные рыбы: треска, лосось, тропическая рыба, иглобрюх.
    fish: true

    # Аксолотль. Чаще попадается в подходящих пресных водоёмах.
    axolotl: true

    # Обычный кальмар.
    squid: true

    # Светящийся кальмар. В основном доступен в глубокой воде.
    glow-squid: true

    # Черепаха. Может попасться возле океана или пляжа.
    turtle: true

    # Дельфин. Очень редкий улов и доступен в океане.
    dolphin: true

    # Лягушка. Может попасться в болотах.
    frog: true

# ------------------------------------------------------------
# ДОЕНИЕ ЖИВОТНЫХ
# ------------------------------------------------------------
milking:
  # Включить ручное доение животных.
  enabled: true

  animals:
    # Разрешить доить коров.
    cow: true

    # Разрешить доить овец.
    sheep: true

    # Разрешить доить коз.
    goat: true

# ------------------------------------------------------------
# КОРМЛЕНИЕ ДЕТЁНЫШЕЙ МОЛОКОМ
# ------------------------------------------------------------
baby:
  # Минимальное количество кормлений молоком, которое потребуется детёнышу.
  milk-feedings-min: 1

  # Максимальное количество кормлений молоком, которое потребуется детёнышу.
  # Для каждого детёныша число выбирается случайно между min и max.
  milk-feedings-max: 3

# ------------------------------------------------------------
# ПРОИЗВОДСТВО НА ФЕРМЕ
# ------------------------------------------------------------
production:
  chicken:
    # Минимальное количество яиц за производство.
    eggs-min: 5

    # Максимальное количество яиц за производство.
    eggs-max: 10

  wool:
    # Минимальное количество шерсти.
    min: 2

    # Максимальное количество шерсти.
    max: 3

# ------------------------------------------------------------
# ДОБЫЧА ПОСЛЕ УБИЙСТВА ЖИВОТНЫХ
# ------------------------------------------------------------
# Для каждого предмета:
# min — минимальное количество
# max — максимальное количество
# ------------------------------------------------------------
drops:
  cow:
    meat: { min: 1, max: 1 }
    leather: { min: 1, max: 1 }
    bone: { min: 2, max: 2 }
  sheep:
    meat: { min: 1, max: 1 }
    leather: { min: 1, max: 1 }
    wool: { min: 1, max: 1 }
    bone: { min: 1, max: 1 }
  goat:
    meat: { min: 1, max: 1 }
    leather: { min: 1, max: 1 }
    bone: { min: 1, max: 1 }
  chicken:
    meat: { min: 1, max: 1 }
    feather: { min: 2, max: 2 }
  horse:
    meat: { min: 1, max: 1 }
    leather: { min: 1, max: 1 }
    bone: { min: 2, max: 2 }
  rabbit:
    meat: { min: 1, max: 1 }
    rabbit-hide: { min: 1, max: 1 }
    bone: { min: 1, max: 1 }

# ------------------------------------------------------------
# СПРАВОЧНЫЙ СПИСОК КОРМА
# ------------------------------------------------------------
# Это описание допустимой пищи.
# Некоторые группы, например трава, листья, кусты, цветы и семена,
# проверяются самим кодом, поэтому перечислять каждый блок отдельно не нужно.
# ------------------------------------------------------------
feeding:
  cow:
    foods: [HAY_BLOCK, WHEAT, APPLE, MELON_SLICE, PUMPKIN, MELON]
  sheep:
    foods: [HAY_BLOCK, WHEAT, ANY_GRASS_LEAVES_BUSHES_FLOWERS]
  goat:
    foods: [HAY_BLOCK, WHEAT, ANY_GRASS_LEAVES_BUSHES_FLOWERS]
  horse:
    foods: [HAY_BLOCK, WHEAT, ANY_GRASS_LEAVES_BUSHES_FLOWERS]
  rabbit:
    foods: [CARROT, GOLDEN_CARROT]
  chicken:
    foods: [ANY_SEEDS, ANY_GRASS_LEAVES_BUSHES_FLOWERS]
  fish:
    foods: [ANY_SEEDS, SEAGRASS, KELP, SEA_PICKLE]

