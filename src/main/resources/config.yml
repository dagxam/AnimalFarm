# ============================================================
# AnimalFarm — полная конфигурация фермы
# Плагин использует совместимый Bukkit/Spigot API и не привязан
# к конкретному серверному ядру.
# После изменения: /animalfarm reload
# ============================================================
feeder:
  enabled: true
  check-interval-seconds: 5
  eating-distance: 2.5
  max-breeding-pairs-per-day: 10
  water-max-stack: 16
  capacity: 20
pen:
  max-radius: 16
  vertical-range: 5
aquarium:
  enabled: true
  max-radius: 16
  vertical-range: 5
  capacity: 30
  owner-only-harvest: true
ownership:
  enabled: true
hud:
  enabled: true
  range: 6

animal-genders:
  enabled: true
  male-chance: 50
  female-chance: 50
  animals:
    cow: true
    sheep: true
    goat: true
    pig: true
    chicken: true
    horse: true
    rabbit: true
  interaction:
    show-info-on-right-click: true
  breeding:
    require-male-and-female: true
  milk:
    females-only: true
  visuals:
    enabled: true
    male-variant: WARM
    female-variant: TEMPERATE
    black-ram: true

# GRASS заменён на актуальный Bukkit Material SHORT_GRASS.
# ANY_LEAVES и ANY_SEEDS — логические группы, которые обрабатываются FarmFoodService.
feeding:
  daily-consumption-min: 3
  daily-consumption-max: 5
  cow: { foods: [WHEAT, HAY_BLOCK, GRASS_BLOCK, SHORT_GRASS, TALL_GRASS, ANY_LEAVES] }
  sheep: { foods: [WHEAT, HAY_BLOCK, GRASS_BLOCK, SHORT_GRASS, TALL_GRASS, ANY_LEAVES] }
  goat: { foods: [WHEAT, HAY_BLOCK, GRASS_BLOCK, SHORT_GRASS, TALL_GRASS, ANY_LEAVES] }
  pig: { foods: [CARROT, POTATO, BEETROOT] }
  horse: { foods: [WHEAT, HAY_BLOCK, GRASS_BLOCK, SHORT_GRASS, TALL_GRASS, ANY_LEAVES] }
  rabbit: { foods: [CARROT, GOLDEN_CARROT] }
  chicken: { foods: [ANY_SEEDS] }
  fish: { foods: [ANY_SEEDS, SEAGRASS, KELP, SEA_PICKLE] }

golden:
  cycles-min: 2
  cycles-max: 3

mob-bucket:
  enabled: true

fishing:
  enabled: true
  live-catch-chance: 25
  mobs:
    fish: true
    axolotl: true
    squid: true
    glow-squid: true
    turtle: false
    dolphin: false
    frog: false

milking:
  enabled: true
  animals:
    cow: true
    sheep: true
    goat: true
    horse: true
  milk-min: 1
  milk-max: 3

baby:
  milk-feedings-min: 1
  milk-feedings-max: 3

production:
  chicken: { eggs-min: 5, eggs-max: 10 }
  wool: { min: 2, max: 3 }

drops:
  cow: { meat: { min: 1, max: 1 }, leather: { min: 1, max: 1 }, bone: { min: 2, max: 2 } }
  sheep: { meat: { min: 1, max: 1 }, leather: { min: 1, max: 1 }, wool: { min: 1, max: 1 }, bone: { min: 1, max: 1 } }
  goat: { meat: { min: 1, max: 1 }, leather: { min: 1, max: 1 }, bone: { min: 1, max: 1 } }
  chicken: { meat: { min: 1, max: 1 }, feather: { min: 2, max: 2 } }
  horse: { meat: { min: 1, max: 1 }, leather: { min: 2, max: 2 }, bone: { min: 1, max: 1 } }
  rabbit: { meat: { min: 1, max: 1 }, rabbit-hide: { min: 1, max: 1 }, bone: { min: 1, max: 1 } }

messages:
  prefix: "&8[&6AnimalFarm&8] &r"
  no-permission: "&cУ вас нет прав для выполнения этой команды."
  not-owner: "&cЭто не ваша ферма или аквариум."
  aquarium-no-fish: "&eВ этом аквариуме сейчас нет рыбы."
  aquarium-fish-taken: "&aРыба забрана из аквариума."
  reloaded: "&aКонфигурация успешно перезагружена."
  info: "&fAnimalFarm &7— &eсистема животноводства, аквакультуры и рыбалки."
  milk-cow: "&aВы надоили корову."
  milk-sheep: "&aВы надоили овцу."
  milk-goat: "&aВы надоили козу."
  milk-horse: "&aВы надоили лошадь."
  milk-male: "&cЭто самец. Он не даёт молоко."
  milk-cooldown: "&eВы уже доили сегодня."
  milk-baby: "&aМалыш выпил молоко."
  milk-baby-once: "&eЭтого малыша уже кормили молоком сегодня."
  milk-baby-grown: "&aМалыш получил достаточно молока и вырос."
  pen-open: "&cПространство не замкнуто."
  pen-ready: "&aЗагон активен."
  aquarium-water: "&cАквариум не готов. Внутри должна быть вода."
