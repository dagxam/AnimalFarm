# ============================================================
# AnimalFarm — полная конфигурация фермы v2
# true = включено | false = выключено
# После изменения: /animalfarm reload
# ============================================================

feeder:
  enabled: true
  check-interval-seconds: 5
  eating-distance: 2.5
  max-breeding-pairs-per-day: 10
  water-max-stack: 16
  # Максимум животных в одном загоне. При достижении лимита новые животные не рождаются.
  capacity: 20

pen:
  max-radius: 16
  vertical-range: 5
  # Загон может быть сделан из любых полноценных закрывающих блоков.
  # Забор и стекло не обязательны.

aquarium:
  enabled: true
  max-radius: 16
  vertical-range: 5
  # Максимум рыб в одном аквариуме.
  capacity: 30

hud:
  enabled: true
  range: 6

# Суточное питание. Один успешный цикл автоматически расходует случайно 3-5 единиц подходящей еды.
feeding:
  daily-consumption-min: 3
  daily-consumption-max: 5
  cow: { foods: [HAY_BLOCK, WHEAT, APPLE, MELON_SLICE, PUMPKIN, MELON] }
  sheep: { foods: [HAY_BLOCK, WHEAT, ANY_GRASS_LEAVES_BUSHES_FLOWERS] }
  goat: { foods: [HAY_BLOCK, WHEAT, ANY_GRASS_LEAVES_BUSHES_FLOWERS] }
  horse: { foods: [HAY_BLOCK, WHEAT, ANY_GRASS_LEAVES_BUSHES_FLOWERS] }
  rabbit: { foods: [CARROT, GOLDEN_CARROT] }
  chicken: { foods: [ANY_SEEDS, ANY_GRASS_LEAVES_BUSHES_FLOWERS] }
  fish: { foods: [ANY_SEEDS, SEAGRASS, KELP, SEA_PICKLE] }

# Золотой режим: золотое яблоко или золотая морковь запускают ускоренный режим кормушки.
# В этот день выполняется 2-3 цикла размножения и 2-3 цикла производства, если хватает места и ресурсов.
golden:
  cycles-min: 2
  cycles-max: 3

mob-bucket:
  enabled: true

fishing:
  enabled: true
  live-catch-chance: 90
  # Обычные рыбы выдаются как предметы: треска, лосось, тропическая рыба, иглобрюх.
  # Остальные существа выдаются яйцом призыва.
  # Свежую рыбу из инвентаря можно отпустить правой кнопкой по воде.
  mobs:
    fish: true
    axolotl: true
    squid: true
    glow-squid: true
    turtle: true
    dolphin: true
    frog: true

milking:
  enabled: true
  animals:
    cow: true
    sheep: true
    goat: true
  milk-min: 1
  milk-max: 3

baby:
  milk-feedings-min: 1
  milk-feedings-max: 3

production:
  # Количество продукции выбирается случайно между min и max и ограничивается числом взрослых животных.
  chicken:
    eggs-min: 5
    eggs-max: 10
  wool:
    min: 2
    max: 3

drops:
  cow: { meat: { min: 1, max: 1 }, leather: { min: 1, max: 1 }, bone: { min: 2, max: 2 } }
  sheep: { meat: { min: 1, max: 1 }, leather: { min: 1, max: 1 }, wool: { min: 1, max: 1 }, bone: { min: 1, max: 1 } }
  goat: { meat: { min: 1, max: 1 }, leather: { min: 1, max: 1 }, bone: { min: 1, max: 1 } }
  chicken: { meat: { min: 1, max: 1 }, feather: { min: 2, max: 2 } }
  horse: { meat: { min: 1, max: 1 }, leather: { min: 1, max: 1 }, bone: { min: 2, max: 2 } }
  rabbit: { meat: { min: 1, max: 1 }, rabbit-hide: { min: 1, max: 1 }, bone: { min: 1, max: 1 } }

messages:
  prefix: "&8[&6AnimalFarm&8] &r"
  no-permission: "&cУ вас нет прав для выполнения этой команды."
  reloaded: "&aКонфигурация успешно перезагружена."
  info: "&fAnimalFarm &7— &eсистема животноводства, аквакультуры и рыбалки."
  milk-cow: "&aВы надоили корову."
  milk-sheep: "&aВы надоили овцу."
  milk-goat: "&aВы надоили козу."
  milk-cooldown: "&eВы уже доили сегодня."
  milk-baby: "&aМалыш выпил молоко."
  milk-baby-once: "&eЭтого малыша уже кормили молоком сегодня."
  milk-baby-grown: "&aМалыш получил достаточно молока и вырос."
  pen-open: "&cПространство не замкнуто."
  pen-ready: "&aЗагон активен."
  aquarium-water: "&cАквариум не готов. Внутри должна быть вода."
