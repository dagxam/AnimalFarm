# ============================================================
# AnimalFarm — основная конфигурация
# ============================================================

feeder:
  enabled: true

  # Проверка животных каждые 2 секунды.
  # Само размножение выполняется обычным ванильным AI Minecraft.
  check-interval-seconds: 2

  # Животное должно физически подойти к кормушке.
  eating-distance: 2.5
  path-speed: 1.1

  # Не больше двух автоматических кормлений за один цикл.
  max-feedings-per-cycle: 2

  # Одно полное ведро воды хватает на 10 автоматических кормлений.
  # Ведро находится прямо внутри бочки и после расходования превращается в пустое.
  water-feedings-per-bucket: 10

pen:
  # Максимальный радиус определения закрытого загона.
  max-radius: 16
  vertical-range: 5

hud:
  enabled: true
  range: 6

milking:
  enabled: true
  cooldown-seconds: 30
  animals:
    cow: true
    sheep: true
    goat: true

drops:
  cow:
    meat: { min: 1, max: 3 }
    leather: { min: 0, max: 2 }
    bone: { min: 2, max: 2 }

  sheep:
    meat: { min: 1, max: 3 }
    leather: { min: 0, max: 2 }
    wool: { min: 1, max: 3 }
    bone: { min: 1, max: 1 }

  goat:
    # Предмет технически использует MUTTON, но получает имя «Козлятина».
    meat: { min: 1, max: 2 }
    leather: { min: 0, max: 2 }
    bone: { min: 1, max: 1 }

  chicken:
    feather: { min: 3, max: 6 }

feeding:
  cow:
    enabled: true
    foods: [WHEAT]
  sheep:
    enabled: true
    foods: [WHEAT]
  goat:
    enabled: true
    foods: [WHEAT]
  chicken:
    enabled: true
    foods:
      - WHEAT_SEEDS
      - BEETROOT_SEEDS
      - PUMPKIN_SEEDS
      - MELON_SEEDS
      - TORCHFLOWER_SEEDS
      - PITCHER_POD

# В активном загоне курицы получают дополнительные яйца при обычной кладке.
chicken:
  pen-extra-eggs:
    min: 1
    max: 2

messages:
  prefix: "&8[&6AnimalFarm&8] &r"
  no-permission: "&cУ вас нет прав для выполнения этой команды."
  reloaded: "&aКонфигурация успешно перезагружена."
  info: "&fAnimalFarm &7— &eсистема животноводства и автоматических загонов."
  milk-cow: "&aВы надоили корову."
  milk-sheep: "&aВы надоили барана."
  milk-goat: "&aВы надоили козу."
  milk-cooldown: "&eЭто животное пока не даёт молоко."
  water-added: "&bВода добавлена в кормушку. &7Пустое ведро возвращено."
  water-full: "&eВ кормушке нет свободного места для воды."
  pen-open: "&cЗагон не закрыт. &7Полностью замкните его забором и оставьте ровно одну закрытую калитку."
  pen-no-gate: "&cЗагон не готов. &7Нужна ровно одна закрытая калитка."
  pen-many-gates: "&cЗагон не готов. &7В загоне должна быть только одна калитка."
  pen-ready: "&aЗагон активен."
