# ============================================================
# AnimalFarm — основная конфигурация
# ============================================================

# Кормушка.
# Кормушка выглядит как обычная ванильная бочка.
# Получается крафтом из 4 бочек.
feeder:
  enabled: true

  # Как часто проверять готовые загоны.
  interval-seconds: 5

  # Максимальный запас воды в одной кормушке.
  # 1 ведро воды = 1 единица воды.
  max-water: 64

  # Максимум пар, которые могут быть запущены за одну проверку одной кормушки.
  max-births-per-cycle: 1

# Автоматический загон.
pen:
  # Максимальный радиус поиска границы загона.
  max-radius: 16

  # Для автоматической работы обязательно:
  # 1) замкнутая территория;
  # 2) ровно одна закрытая калитка;
  # 3) внутри стоит кормушка;
  # 4) внутри есть минимум два взрослых животных одного вида;
  # 5) есть подходящий корм и вода.

# Доение животных.
milking:
  enabled: true
  cooldown-seconds: 30
  animals:
    cow: true
    sheep: true
    goat: true

# Дроп животных.
drops:
  cow:
    meat:
      min: 1
      max: 3
    leather:
      min: 0
      max: 2
    bone:
      min: 0
      max: 2

  sheep:
    meat:
      min: 1
      max: 3
    leather:
      min: 0
      max: 2
    wool:
      min: 1
      max: 3
    bone:
      min: 0
      max: 2

  goat:
    meat:
      min: 1
      max: 2
    leather:
      min: 0
      max: 2
    bone:
      min: 0
      max: 2

# Корм для автоматического размножения.
feeding:
  cow:
    enabled: true
    foods:
      - WHEAT

  sheep:
    enabled: true
    foods:
      - WHEAT

  goat:
    enabled: true
    foods:
      - WHEAT

  chicken:
    enabled: true
    # Для кур разрешены любые перечисленные семена.
    foods:
      - WHEAT_SEEDS
      - BEETROOT_SEEDS
      - PUMPKIN_SEEDS
      - MELON_SEEDS

# Сообщения игрокам.
# Технические команды и permissions остаются на английском.
messages:
  prefix: "&8[&6AnimalFarm&8] &r"
  no-permission: "&cУ вас нет прав для выполнения этой команды."
  reloaded: "&aКонфигурация успешно перезагружена."
  info: "&fAnimalFarm &7— &eсистема животноводства и автоматических загонов."

  milk-cow: "&aВы надоили корову."
  milk-sheep: "&aВы надоили барана."
  milk-goat: "&aВы надоили козу."
  milk-cooldown: "&eЭто животное пока не даёт молоко."

  water-added: "&bВода добавлена в кормушку. &7Пустое ведро возвращено."
  water-full: "&eКормушка уже заполнена водой."

  pen-open: "&cЗагон не закрыт. &7Полностью замкните его забором и оставьте ровно одну закрытую калитку."
  pen-no-gate: "&cЗагон не готов. &7Нужна ровно одна закрытая калитка."
  pen-many-gates: "&cЗагон не готов. &7В загоне должна быть только одна калитка."
  pen-ready: "&aЗагон активен. &7Животных внутри: &e%animals%&7."
