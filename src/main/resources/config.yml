# ============================================================
# AnimalFarm — основная конфигурация
# ============================================================

feeder:
  enabled: true
  check-interval-seconds: 2
  eating-distance: 2.5
  path-speed: 1.1
  max-breeding-pairs-per-day: 10
  water-feedings-per-bucket: 1
  water-max-stack: 16

aquarium:
  enabled: true
  max-radius: 16
  vertical-range: 5

pen:
  max-radius: 16
  vertical-range: 5

hud:
  enabled: true
  range: 6

mob-bucket:
  enabled: true

milking:
  enabled: true
  animals:
    cow: true
    sheep: true
    goat: true
  milk-min: 2
  milk-max: 3

baby:
  milk-feedings-required: 3

# Яйца и шерсть НЕ складываются в кормушку.
# Яйца появляются на полу загона: 5-10 на взрослую курицу за сутки,
# только если в загоне есть минимум две взрослые курицы.
production:
  chicken:
    eggs-min: 5
    eggs-max: 10
  dairy:
    milk-min: 2
    milk-max: 3
  wool:
    min: 0
    max: 0

drops:
  cow:
    meat: { min: 1, max: 1 }
    leather: { min: 1, max: 1 }
    bone: { min: 2, max: 2 }
  sheep:
    meat: { min: 1, max: 1 }
    leather: { min: 1, max: 1 }
    wool: { min: 1, max: 1 }
    bone: { min: 1, max: 1 }
  goat:
    meat: { min: 1, max: 1 }
    leather: { min: 1, max: 1 }
    bone: { min: 1, max: 1 }
  chicken:
    meat: { min: 1, max: 1 }
    feather: { min: 2, max: 2 }
  horse:
    meat: { min: 1, max: 1 }
    leather: { min: 1, max: 1 }
    bone: { min: 2, max: 2 }
  rabbit:
    meat: { min: 1, max: 1 }
    rabbit-hide: { min: 1, max: 1 }
    bone: { min: 1, max: 1 }

# На одну пару за сутки расходуется две единицы корма и одно ведро воды.
feeding:
  cow:
    enabled: true
    foods: [WHEAT]
  sheep:
    enabled: true
    foods: [WHEAT]
  goat:
    enabled: true
    foods: [WHEAT]
  horse:
    enabled: true
    foods: [WHEAT]
  rabbit:
    enabled: true
    foods: [CARROT, GOLDEN_CARROT, DANDELION]
  chicken:
    enabled: true
    foods: ANY_SEEDS
  fish:
    enabled: true
    foods: ANY_SEEDS

messages:
  prefix: "&8[&6AnimalFarm&8] &r"
  no-permission: "&cУ вас нет прав для выполнения этой команды."
  reloaded: "&aКонфигурация успешно перезагружена."
  info: "&fAnimalFarm &7— &eсистема животноводства и автоматических загонов."
  milk-cow: "&aВы надоили корову."
  milk-sheep: "&aВы надоили барана."
  milk-goat: "&aВы надоили козу."
  milk-baby: "&aМалыш выпил молоко. &7Нужно несколько кормлений для роста."
  milk-cooldown: "&eВы уже доили сегодня."
  water-added: "&bВода добавлена в кормушку. &7Пустое ведро возвращено."
  water-full: "&eВ кормушке нет свободного места для воды."
  pen-open: "&cЗагон не закрыт. &7Полностью замкните его забором и оставьте ровно одну закрытую калитку."
  pen-no-gate: "&cЗагон не готов. &7Нужна ровно одна закрытая калитка."
  pen-many-gates: "&cЗагон не готов. &7В загоне должна быть только одна калитка."
  pen-ready: "&aЗагон активен."
