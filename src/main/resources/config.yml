# ============================================================
# AnimalFarm — полная конфигурация фермы v2
# Целевое ядро: Purpur 26.2
# После изменения: /animalfarm reload
# ============================================================
feeder:
  enabled: true
  check-interval-seconds: 5
  eating-distance: 2.5
  max-breeding-pairs-per-day: 10
  water-max-stack: 16
  capacity: 20
pen:
  max-radius: 16
  vertical-range: 5
aquarium:
  enabled: true
  max-radius: 16
  vertical-range: 5
  capacity: 30
  owner-only-harvest: true
ownership:
  enabled: true
hud:
  enabled: true
  range: 6

# ============================================================
# Ресурс-пак AnimalFarm
# Purpur отправляет пакет игрокам через стандартный API сервера.
# URL должен вести непосредственно на ZIP-файл ресурс-пака.
# ============================================================
resource-pack:
  enabled: true
  url: "https://raw.githubusercontent.com/dagxam/AnimalFarm/main/resourcepack/AnimalFarm-Gender-ResourcePack.zip"

# ============================================================
# Система пола животных
# Пол хранится непосредственно в животном через PersistentDataContainer.
# После назначения не меняется и сохраняется после перезапуска сервера.
# Старым животным пол назначается автоматически при первой обработке.
# ============================================================
animal-genders:
  enabled: true
  # Вероятности. Значения нормализуются автоматически; безопасно 0-100.
  male-chance: 50
  female-chance: 50
  animals:
    cow: true
    sheep: true
    goat: true
    pig: true
    chicken: true
  interaction:
    # ПКМ по животному без ведра показывает информацию о поле и возрасте.
    show-info-on-right-click: true
  breeding:
    # При true размножаться могут только самец и самка одного вида.
    require-male-and-female: true
  milk:
    # При true коровы и козы-самцы молоко не дают.
    females-only: true
  visuals:
    # Используются только безопасные ванильные признаки внешности.
    # Дополнительные ItemDisplay и подмена моделей не создаются.
    # Баран остаётся настоящей ванильной чёрной овцой.
    enabled: true

feeding:
  daily-consumption-min: 3
  daily-consumption-max: 5
  cow: { foods: [HAY_BLOCK, WHEAT, APPLE, MELON_SLICE, PUMPKIN, MELON] }
  sheep: { foods: [HAY_BLOCK, WHEAT, ANY_GRASS_LEAVES_BUSHES_FLOWERS] }
  goat: { foods: [HAY_BLOCK, WHEAT, ANY_GRASS_LEAVES_BUSHES_FLOWERS] }
  pig: { foods: [CARROT, POTATO, BEETROOT] }
  horse: { foods: [HAY_BLOCK, WHEAT, ANY_GRASS_LEAVES_BUSHES_FLOWERS] }
  rabbit: { foods: [CARROT, GOLDEN_CARROT] }
  chicken: { foods: [ANY_SEEDS, ANY_GRASS_LEAVES_BUSHES_FLOWERS] }
  fish: { foods: [ANY_SEEDS, SEAGRASS, KELP, SEA_PICKLE] }
golden:
  cycles-min: 2
  cycles-max: 3
mob-bucket:
  enabled: true
fishing:
  enabled: true
  live-catch-chance: 90
  mobs: { fish: true, axolotl: true, squid: true, glow-squid: true, turtle: true, dolphin: true, frog: true }
milking:
  enabled: true
  animals: { cow: true, sheep: true, goat: true }
  milk-min: 1
  milk-max: 3
baby:
  milk-feedings-min: 1
  milk-feedings-max: 3
production:
  chicken: { eggs-min: 5, eggs-max: 10 }
  wool: { min: 2, max: 3 }
drops:
  cow: { meat: { min: 1, max: 1 }, leather: { min: 1, max: 1 }, bone: { min: 2, max: 2 } }
  sheep: { meat: { min: 1, max: 1 }, leather: { min: 1, max: 1 }, wool: { min: 1, max: 1 }, bone: { min: 1, max: 1 } }
  goat: { meat: { min: 1, max: 1 }, leather: { min: 1, max: 1 }, bone: { min: 1, max: 1 } }
  chicken: { meat: { min: 1, max: 1 }, feather: { min: 2, max: 2 } }
  horse: { meat: { min: 1, max: 1 }, leather: { min: 1, max: 1 }, bone: { min: 2, max: 2 } }
  rabbit: { meat: { min: 1, max: 1 }, rabbit-hide: { min: 1, max: 1 }, bone: { min: 1, max: 1 } }
