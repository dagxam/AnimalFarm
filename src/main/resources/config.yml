# ============================================================
# AnimalFarm — основная конфигурация
# Все игровые сутки считаются по 24000 игровых тиков.
# ============================================================

feeder:
  enabled: true
  check-interval-seconds: 5
  eating-distance: 2.5
  path-speed: 1.1
  max-breeding-pairs-per-day: 10
  water-max-stack: 16

# Обычный загон: забор полностью замкнут и есть ровно одна закрытая калитка.
pen:
  max-radius: 16
  vertical-range: 5

# Аквариум: граница из любого стекла или стеклянных панелей, внутри вода.
# Калитка для аквариума не нужна.
aquarium:
  enabled: true
  max-radius: 16
  vertical-range: 5

hud:
  enabled: true
  range: 6

mob-bucket:
  enabled: true

# Кормление и дойка выполняются не чаще одного раза за игровые сутки.
milking:
  enabled: true
  animals:
    cow: true
    sheep: true
    goat: true

baby:
  # Для коровы, овцы, козы и лошади число кормлений молоком выбирается случайно: 1-3.
  milk-feedings-min: 1
  milk-feedings-max: 3

# Производство. Молоко НЕ создаётся автоматически: животное доится игроком.
# Яйца НЕ кладутся в кормушку: они появляются на полу и не исчезают сами.
# Шерсть собирается в кормушку и в HUD не показывается.
production:
  chicken:
    eggs-min: 5
    eggs-max: 10
  wool:
    min: 2
    max: 3

# Точные выпадения после убийства.
drops:
  cow:
    meat: { min: 1, max: 1 }
    leather: { min: 1, max: 1 }
    bone: { min: 2, max: 2 }
  sheep:
    meat: { min: 1, max: 1 }
    leather: { min: 1, max: 1 }
    wool: { min: 1, max: 1 }
    bone: { min: 1, max: 1 }
  goat:
    meat: { min: 1, max: 1 }
    leather: { min: 1, max: 1 }
    bone: { min: 1, max: 1 }
  chicken:
    meat: { min: 1, max: 1 }
    feather: { min: 2, max: 2 }
  horse:
    meat: { min: 1, max: 1 }
    leather: { min: 1, max: 1 }
    bone: { min: 2, max: 2 }
  rabbit:
    meat: { min: 1, max: 1 }
    rabbit-hide: { min: 1, max: 1 }
    bone: { min: 1, max: 1 }

# Справочные настройки допустимого корма.
# Фактические группы пищи проверяются кодом, чтобы поддерживать любые виды травы,
# листья, кусты, цветы и любые семена.
feeding:
  cow:
    foods: [HAY_BLOCK, WHEAT, APPLE, MELON_SLICE, PUMPKIN, MELON]
  sheep:
    foods: [HAY_BLOCK, WHEAT, ANY_GRASS_LEAVES_BUSHES_FLOWERS]
  goat:
    foods: [HAY_BLOCK, WHEAT, ANY_GRASS_LEAVES_BUSHES_FLOWERS]
  horse:
    foods: [HAY_BLOCK, WHEAT, ANY_GRASS_LEAVES_BUSHES_FLOWERS]
  rabbit:
    foods: [CARROT, GOLDEN_CARROT]
  chicken:
    foods: [ANY_SEEDS, ANY_GRASS_LEAVES_BUSHES_FLOWERS]
  fish:
    foods: [ANY_SEEDS, SEAGRASS, KELP, SEA_PICKLE]

messages:
  prefix: "&8[&6AnimalFarm&8] &r"
  no-permission: "&cУ вас нет прав для выполнения этой команды."
  reloaded: "&aКонфигурация успешно перезагружена."
  info: "&fAnimalFarm &7— &eсистема животноводства, кормушек и аквариумов."
  milk-cow: "&aВы надоили корову."
  milk-sheep: "&aВы надоили овцу."
  milk-goat: "&aВы надоили козу."
  milk-cooldown: "&eВы уже доили сегодня."
  milk-baby: "&aМалыш выпил молоко. &7Следующее кормление — не раньше следующего игрового дня."
  milk-baby-once: "&eЭтого малыша уже кормили молоком сегодня."
  milk-baby-grown: "&aМалыш получил достаточно молока и вырос."
  pen-open: "&cЗагон не закрыт. &7Полностью замкните его забором и оставьте ровно одну закрытую калитку."
  pen-no-gate: "&cЗагон не готов. &7Нужна ровно одна закрытая калитка."
  pen-many-gates: "&cЗагон не готов. &7В загоне должна быть только одна калитка."
  pen-ready: "&aЗагон активен."
  aquarium-water: "&cАквариум не готов. &7Внутри должна быть вода."
