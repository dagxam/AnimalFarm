# ============================================================
# AnimalFarm — основная конфигурация
# ============================================================

feeder:
  enabled: true
  check-interval-seconds: 2
  eating-distance: 2.5
  path-speed: 1.1
  max-breeding-pairs-per-day: 10
  # Одно размножение пары = одно ведро воды за игровые сутки.
  water-feedings-per-bucket: 1
  water-max-stack: 16

pen:
  max-radius: 16
  vertical-range: 5

hud:
  enabled: true
  range: 6

mob-bucket:
  enabled: true

milking:
  enabled: true
  # Ручная дойка контролируется отдельно в коде по игровым суткам.
  cooldown-seconds: 86400
  animals:
    cow: true
    sheep: true
    goat: true

# Автоматически яйца и шерсть в кормушку НЕ добавляются.
# Для молока игрок кладёт пустые ведра в кормушку; один раз за игровые сутки
# кормушка заполняет их молоком от взрослых коров, овец и коз.
production:
  chicken:
    eggs-min: 0
    eggs-max: 0
  dairy:
    milk-min: 2
    milk-max: 3
  wool:
    min: 0
    max: 0

drops:
  cow:
    meat: { min: 1, max: 1 }
    leather: { min: 1, max: 1 }
    bone: { min: 2, max: 2 }
  sheep:
    meat: { min: 1, max: 1 }
    leather: { min: 1, max: 1 }
    wool: { min: 1, max: 1 }
    bone: { min: 1, max: 1 }
  goat:
    meat: { min: 1, max: 1 }
    leather: { min: 1, max: 1 }
    bone: { min: 1, max: 1 }
  chicken:
    meat: { min: 1, max: 1 }
    feather: { min: 2, max: 2 }

# Для размножения одна пара за игровые сутки расходует:
# корова/овца/коза — 2 пшеницы + 1 ведро воды;
# курица — 2 семени + 1 ведро воды.
feeding:
  cow:
    enabled: true
    foods: [WHEAT]
  sheep:
    enabled: true
    foods: [WHEAT]
  goat:
    enabled: true
    foods: [WHEAT]
  chicken:
    enabled: true
    foods:
      - WHEAT_SEEDS
      - BEETROOT_SEEDS
      - PUMPKIN_SEEDS
      - MELON_SEEDS
      - TORCHFLOWER_SEEDS
      - PITCHER_POD

messages:
  prefix: "&8[&6AnimalFarm&8] &r"
  no-permission: "&cУ вас нет прав для выполнения этой команды."
  reloaded: "&aКонфигурация успешно перезагружена."
  info: "&fAnimalFarm &7— &eсистема животноводства и автоматических загонов."
  milk-cow: "&aВы надоили корову."
  milk-sheep: "&aВы надоили барана."
  milk-goat: "&aВы надоили козу."
  milk-baby: "&aМалыш выпил молоко. &7Два кормления — и он вырастет."
  milk-cooldown: "&eВы уже доили сегодня."
  water-added: "&bВода добавлена в кормушку. &7Пустое ведро возвращено."
  water-full: "&eВ кормушке нет свободного места для воды."
  pen-open: "&cЗагон не закрыт. &7Полностью замкните его забором и оставьте ровно одну закрытую калитку."
  pen-no-gate: "&cЗагон не готов. &7Нужна ровно одна закрытая калитка."
  pen-many-gates: "&cЗагон не готов. &7В загоне должна быть только одна калитка."
  pen-ready: "&aЗагон активен."
