# ============================================================
# AnimalFarm — основная конфигурация плагина
#
# true  = включено
# false = выключено
# После изменений: /animalfarm reload
# ============================================================

feeder:
  # Включить автоматические кормушки.
  enabled: true

  # Интервал проверки активных кормушек, секунд.
  check-interval-seconds: 5

  # Дальность, на которой животное считается рядом с кормушкой.
  eating-distance: 2.5

  # Максимум пар автоматического размножения за сутки на кормушку.
  max-breeding-pairs-per-day: 10

  # Максимум вёдер в одном водном стеке.
  water-max-stack: 16

  # Каждый обычный цикл размножения потребляет случайно 3-5 единиц еды.
  # Для рыб действует такой же расход.

pen:
  # Максимальный размер закрытого пространства вокруг кормушки.
  max-radius: 16

  # Допустимая высота пространства вверх/вниз.
  vertical-range: 5

  # Граница может быть любым непроходимым блоком.
  # Забор/стекло больше НЕ обязательны.

aquarium:
  # Включить автоматические рыбные кормушки.
  enabled: true

  # Максимальный размер закрытого пространства вокруг кормушки.
  max-radius: 16

  # Допустимая высота пространства вверх/вниз.
  vertical-range: 5

  # Достаточно любого полностью закрытого пространства, внутри которого есть вода.

hud:
  # Показывать данные кормушки при наведении на неё.
  enabled: true

  # Дальность наведения.
  range: 6

mob-bucket:
  # Специальное ведро для мобов.
  enabled: true

fishing:
  # Живая ловля существ вместо обычной добычи.
  enabled: true

  # Вероятность живого улова, процент.
  live-catch-chance: 90

  mobs:
    # Треска, лосось, тропическая рыба, иглобрюх.
    fish: true
    # Аксолотль.
    axolotl: true
    # Кальмар.
    squid: true
    # Светящийся кальмар.
    glow-squid: true
    # Черепаха.
    turtle: true
    # Дельфин.
    dolphin: true
    # Лягушка.
    frog: true

  # Если для существа есть ванильное яйцо призыва, улов выдаётся этим яйцом.
  # Само существо не теряется.

milking:
  # Разрешить доение взрослых животных.
  enabled: true
  animals:
    cow: true
    sheep: true
    goat: true

  # Количество обычного автоматического молока в сутки.
  # Используется как диапазон 1-3 при наличии пустых вёдер.
  milk-min: 1
  milk-max: 3

baby:
  # Требуемое количество кормлений молоком выбирается случайно.
  milk-feedings-min: 1
  milk-feedings-max: 3

production:
  chicken:
    eggs-min: 5
    eggs-max: 10
  wool:
    min: 2
    max: 3

drops:
  cow:
    meat: { min: 1, max: 1 }
    leather: { min: 1, max: 1 }
    bone: { min: 2, max: 2 }
  sheep:
    meat: { min: 1, max: 1 }
    leather: { min: 1, max: 1 }
    wool: { min: 1, max: 1 }
    bone: { min: 1, max: 1 }
  goat:
    meat: { min: 1, max: 1 }
    leather: { min: 1, max: 1 }
    bone: { min: 1, max: 1 }
  chicken:
    meat: { min: 1, max: 1 }
    feather: { min: 2, max: 2 }
  horse:
    meat: { min: 1, max: 1 }
    leather: { min: 1, max: 1 }
    bone: { min: 2, max: 2 }
  rabbit:
    meat: { min: 1, max: 1 }
    rabbit-hide: { min: 1, max: 1 }
    bone: { min: 1, max: 1 }

feeding:
  # Базовые списки кормов. Группы семян обрабатываются кодом.
  cow:
    foods: [HAY_BLOCK, WHEAT, APPLE, MELON_SLICE, PUMPKIN, MELON]
  sheep:
    foods: [HAY_BLOCK, WHEAT, ANY_GRASS_LEAVES_BUSHES_FLOWERS]
  goat:
    foods: [HAY_BLOCK, WHEAT, ANY_GRASS_LEAVES_BUSHES_FLOWERS]
  horse:
    foods: [HAY_BLOCK, WHEAT, ANY_GRASS_LEAVES_BUSHES_FLOWERS]
  rabbit:
    foods: [CARROT, GOLDEN_CARROT]
  chicken:
    foods: [ANY_SEEDS, ANY_GRASS_LEAVES_BUSHES_FLOWERS]
  fish:
    foods: [ANY_SEEDS, SEAGRASS, KELP, SEA_PICKLE]

# Золотое ускорение:
# золотое яблоко или золотая морковь в кормушке дают ускоренное размножение.
# Для такой пары кулдаун равен 1-2 игровым дням вместо обычных 1-3.
# В обычном цикле животное/рыба размножается автоматически не чаще одного раза
# после выбранного случайного интервала 1-3 дня.

messages:
  prefix: "&8[&6AnimalFarm&8] &r"
  no-permission: "&cУ вас нет прав для выполнения этой команды."
  reloaded: "&aКонфигурация успешно перезагружена."
  info: "&fAnimalFarm &7— &eсистема животноводства, кормушек и аквариумов."
  milk-cow: "&aВы надоили корову."
  milk-sheep: "&aВы надоили овцу."
  milk-goat: "&aВы надоили козу."
  milk-cooldown: "&eВы уже доили сегодня."
  milk-baby: "&aМалыш выпил молоко."
  milk-baby-once: "&eЭтого малыша уже кормили молоком сегодня."
  milk-baby-grown: "&aМалыш получил достаточно молока и вырос."
  pen-open: "&cПространство не замкнуто."
  pen-ready: "&aЗагон активен."
  aquarium-water: "&cАквариум не готов. Внутри должна быть вода."
