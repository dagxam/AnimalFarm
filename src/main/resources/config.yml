# ============================================================
# AnimalFarm — основная конфигурация
# ============================================================

feeder:
  enabled: true
  check-interval-seconds: 2
  eating-distance: 2.5
  path-speed: 1.1
  max-breeding-pairs-per-day: 10
  water-feedings-per-bucket: 10

pen:
  max-radius: 16
  vertical-range: 5

hud:
  enabled: true
  range: 6

mob-bucket:
  enabled: true

milking:
  enabled: true
  cooldown-seconds: 30
  animals:
    cow: true
    sheep: true
    goat: true

# Производство теперь не засоряет кормушку.
# При наличии сундука на заборе молоко, шерсть и яйца собираются туда раз в игровые сутки.
# Без сундука молоко и шерсть собираются вручную, а яйца остаются на полу загона.
production:
  chicken:
    eggs-min: 0
    eggs-max: 0
  dairy:
    milk-min: 0
    milk-max: 0
  chest:
    milk-min: 5
    milk-max: 10
    wool-min: 1
    wool-max: 2
    egg-min: 5
    egg-max: 10

drops:
  cow:
    meat: { min: 1, max: 3 }
    leather: { min: 0, max: 2 }
    bone: { min: 2, max: 2 }
  sheep:
    meat: { min: 1, max: 3 }
    leather: { min: 0, max: 2 }
    wool: { min: 1, max: 3 }
    bone: { min: 1, max: 1 }
  goat:
    meat: { min: 1, max: 2 }
    leather: { min: 0, max: 2 }
    bone: { min: 1, max: 1 }
  chicken:
    feather: { min: 3, max: 6 }

feeding:
  cow:
    enabled: true
    foods: [WHEAT]
  sheep:
    enabled: true
    foods: [WHEAT]
  goat:
    enabled: true
    foods: [WHEAT]
  chicken:
    enabled: true
    foods:
      - WHEAT_SEEDS
      - BEETROOT_SEEDS
      - PUMPKIN_SEEDS
      - MELON_SEEDS
      - TORCHFLOWER_SEEDS
      - PITCHER_POD

messages:
  prefix: "&8[&6AnimalFarm&8] &r"
  no-permission: "&cУ вас нет прав для выполнения этой команды."
  reloaded: "&aКонфигурация успешно перезагружена."
  info: "&fAnimalFarm &7— &eсистема животноводства и автоматических загонов."
  milk-cow: "&aВы надоили корову."
  milk-sheep: "&aВы надоили барана."
  milk-goat: "&aВы надоили козу."
  milk-baby: "&aМалыш выпил молоко. &7Два кормления — и он вырастет."
  milk-cooldown: "&eЭто животное пока не даёт молоко."
  water-added: "&bВода добавлена в кормушку. &7Пустое ведро возвращено."
  water-full: "&eВ кормушке нет свободного места для воды."
  pen-open: "&cЗагон не закрыт. &7Полностью замкните его забором и оставьте ровно одну закрытую калитку."
  pen-no-gate: "&cЗагон не готов. &7Нужна ровно одна закрытая калитка."
  pen-many-gates: "&cЗагон не готов. &7В загоне должна быть только одна калитка."
  pen-ready: "&aЗагон активен."
