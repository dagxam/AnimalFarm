name: AnimalFarm
version: 1.0.0
author: dagxam
main: ru.dagxam.animalfarm.AnimalFarmPlugin
api-version: '26.2'
description: Расширенная система животноводства, кормушек и автоматических загонов.
website: https://github.com/dagxam/AnimalFarm

commands:
  animalfarm:
    description: Управление плагином AnimalFarm.
    usage: /animalfarm <reload|info>
    permission: animalfarm.admin

permissions:
  animalfarm.admin:
    description: Доступ к административным командам AnimalFarm.
    default: op
