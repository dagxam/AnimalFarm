name: AnimalFarm
version: 1.1.0
author: dagxam
main: ru.dagxam.animalfarm.AnimalFarmPlugin
api-version: '1.21'
description: Система животноводства, кормушек и автоматических загонов.

commands:
  animalfarm:
    description: Управление плагином AnimalFarm.
    usage: /animalfarm <reload|info>
    permission: animalfarm.admin

permissions:
  animalfarm.admin:
    description: Доступ к административным командам AnimalFarm.
    default: op
